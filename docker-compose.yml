services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: payapi
      POSTGRES_PASSWORD: payapi_pw
      POSTGRES_DB: payapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payapi -d payapi"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=payapi;Username=payapi;Password=payapi_pw"
      Admin__Key: "dev-admin-key-change-me"
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
